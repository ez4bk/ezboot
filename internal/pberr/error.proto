syntax = "proto3";

package ezboot.internal.pberr;
option go_package = "github.com/ez4bk/ezboot/internal/pberr";


// 配置 gRPC 错误对应的状态码
message WithHttpStatus {
    // Http状态码
    uint32 http_code = 1;
}

message WithCauseError {
    string cause_error = 1;
}

// 业务错误码；与 gRPC status code 分开，避免把业务码塞进 codes.Code
message WithBizCode {
    uint32 biz_code = 1;
}
